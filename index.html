<!DOCTYPE html>

    <title>Vozvrat — Система управления возвратами</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        
        @keyframes fadeInBlur {
            0% { opacity: 0; filter: blur(10px); transform: scale(0.98); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }
        .animate-screen { animation: fadeInBlur 0.5s ease-out both; }
        
        /* Стили для статусов */
        .status-received { background-color: #dbeafe; color: #1d4ed8; }
        .status-work { background-color: #fef9c3; color: #a16207; }
        .status-archive { background-color: #f3f4f6; color: #374151; }
        .status-done { background-color: #dcfce7; color: #15803d; }

        /* Кастомный скролл для таблиц на мобилках */
        .table-container::-webkit-scrollbar { height: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-0 md:p-4">

    function showScreen(screenId) {
        const content = document.getElementById('main-content');
        const sidebar = document.getElementById('main-sidebar');
        const nav = document.getElementById('sidebar-nav');
        const mobileHeader = document.getElementById('mobile-header');
        
        content.innerHTML = screens[screenId];
        
        if(screenId === 'auth') {
            sidebar.classList.add('hidden');
            mobileHeader.classList.add('hidden');
        } else {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
            } else {
                sidebar.classList.add('hidden');
                mobileHeader.classList.remove('hidden');
            }
        }

        const isClient = screenId.startsWith('client');
        document.getElementById('user-name').innerText = isClient ? 'ИП ТехноМир' : 'Алексей Соколов';
        document.getElementById('user-role').innerText = isClient ? 'Клиент' : 'Сотрудник';
        document.getElementById('user-avatar').src = isClient 
            ? "https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=100&q=80" 
            : "https://images.unsplash.com/photo-1500649297466-74794c70acfc?w=100";

        // ЗАМЕНЕННЫЕ ИКОНКИ В МЕНЮ
        const staffMenu = `
            <button onclick="showScreen('statistics'); closeMobileSidebar()" class="w-full text-left flex items-center gap-3 px-3 py-2 rounded-xl ${screenId === 'statistics' ? 'bg-black text-white' : 'text-gray-600 hover:bg-gray-100'} transition-all"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg> Статистика</button>
            <button onclick="showScreen('staff-list'); closeMobileSidebar()" class="w-full text-left flex items-center gap-3 px-3 py-2 rounded-xl ${screenId === 'staff-list' ? 'bg-black text-white' : 'text-gray-600 hover:bg-gray-100'} transition-all"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg> Возвраты</button>
            <button onclick="showScreen('suppliers'); closeMobileSidebar()" class="w-full text-left flex items-center gap-3 px-3 py-2 rounded-xl ${screenId === 'suppliers' ? 'bg-black text-white' : 'text-gray-600 hover:bg-gray-100'}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1"/></svg> Поставщики</button>

        `;
        const clientMenu = `
            <button onclick="showScreen('client-list'); closeMobileSidebar()" class="w-full text-left flex items-center gap-3 px-3 py-2 rounded-xl ${screenId === 'client-list' ? 'bg-black text-white' : 'text-gray-600 hover:bg-gray-100'}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg> Главная</button>
        `;
        
        nav.innerHTML = isClient ? clientMenu : staffMenu;
        document.getElementById('main-content').scrollTo(0, 0);
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('main-sidebar');
        if (sidebar.classList.contains('hidden')) {
            sidebar.classList.remove('hidden');
            sidebar.classList.add('flex', 'fixed', 'inset-0', 'w-full', 'h-full');
        } else {
            closeMobileSidebar();
        }
    }

    function closeMobileSidebar() {
        if (window.innerWidth < 768) {
            const sidebar = document.getElementById('main-sidebar');
            sidebar.classList.add('hidden');
            sidebar.classList.remove('flex', 'fixed', 'inset-0', 'w-full', 'h-full');
        }
    }

    window.addEventListener('resize', () => {
        if (window.innerWidth >= 768) {
            const sidebar = document.getElementById('main-sidebar');
            sidebar.classList.remove('fixed', 'inset-0', 'w-full', 'h-full');
            if (document.getElementById('user-name').innerText !== '') {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
            }
        }
    });

    showScreen('auth');
</script>
