{% extends "base.html" %}
{% block title %}Создать возврат{% endblock %}

{% block content %}
<div class="p-6 md:p-8 animate-screen">
    <!-- Back + Header -->
    <div class="flex items-center gap-4 mb-6">
        <a href="/refunds" class="w-9 h-9 flex items-center justify-center bg-white rounded-full border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors">
            <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div>
            <h1 class="text-xl font-bold text-gray-900">Новый возврат</h1>
            <p class="text-xs text-gray-500 mt-0.5">Ручное создание возврата</p>
        </div>
    </div>

    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-[32px] shadow-sm border border-gray-100 p-8">
            <form action="/api/refunds" method="post" enctype="multipart/form-data" id="create-form">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Supplier (full width) -->
                    <div class="md:col-span-2">
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Поставщик</label>
                        <select name="supplier_id" class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm">
                            <option value="">— Выберите поставщика —</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Client Account -->
                    <div class="md:col-span-2">
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Аккаунт клиента *</label>
                        <select name="client_user_id" required class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm">
                            <option value="">— Выберите клиента —</option>
                            {% for c in clients %}
                            <option value="{{ c.id }}">{{ c.full_name }} ({{ c.email }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Order ID -->
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">ID Заказа</label>
                        <input type="text" name="order_id" placeholder="#ORD-55441"
                            class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm mono">
                    </div>

                    <!-- Article -->
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Артикул</label>
                        <input type="text" name="article" placeholder="BOSCH-199-22"
                            class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm mono">
                    </div>

                    <!-- Brand -->
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Марка</label>
                        <input type="text" name="brand" placeholder="Bosch, Samsung..."
                            class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm">
                    </div>

                    <!-- Qty + Price -->
                    <div class="grid grid-cols-2 gap-3 md:col-span-2">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Количество</label>
                            <input type="number" name="quantity" value="1" min="1"
                                class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Цена (₽)</label>
                            <input type="text" name="price" placeholder="0.00"
                                class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm">
                        </div>
                    </div>

                    <!-- Reason (full width) -->
                    <div class="md:col-span-2">
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Причина возврата</label>
                        <textarea name="reason" rows="3" placeholder="Опишите причину возврата..."
                            class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm resize-none"></textarea>
                    </div>

                    <!-- Files (full width) -->
                    <div class="md:col-span-2">
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Файлы</label>
                        <label class="flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-[28px] p-8 text-center cursor-pointer hover:border-gray-300 hover:bg-gray-50 transition-all">
                            <svg class="w-10 h-10 text-gray-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                            <p class="text-sm text-gray-400 font-medium">Перетащите файлы или нажмите для выбора</p>
                            <p class="text-xs text-gray-300 mt-1">XLS, XLSX, PDF, JPG, PNG</p>
                            <div id="file-names" class="mt-2 text-xs text-gray-500 font-medium"></div>
                            <input type="file" name="file" multiple class="hidden" accept=".xls,.xlsx,.pdf,.jpg,.jpeg,.png" onchange="showFileNames(this)">
                        </label>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex gap-3 mt-8">
                    <button type="submit" class="flex-1 py-3 bg-gray-900 text-white rounded-2xl font-bold shadow-lg hover:bg-black transition-all text-sm">
                        Сохранить возврат
                    </button>
                    <a href="/refunds" class="flex-none px-6 py-3 bg-gray-100 text-gray-600 rounded-2xl font-semibold hover:bg-gray-200 transition-all text-sm">
                        Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const ALLOWED_EXTS = new Set(['.xls', '.xlsx', '.pdf', '.jpg', '.jpeg', '.png']);
const MAX_SIZE = 20 * 1024 * 1024;

function showFileNames(input) {
    const div = document.getElementById('file-names');
    const valid = [];
    const errors = [];

    Array.from(input.files).forEach(f => {
        const ext = f.name.slice(f.name.lastIndexOf('.')).toLowerCase();
        if (!ALLOWED_EXTS.has(ext)) {
            errors.push(f.name + ' — недопустимый формат');
        } else if (f.size > MAX_SIZE) {
            errors.push(f.name + ' — превышает 20 МБ');
        } else {
            valid.push(f);
        }
    });

    const dt = new DataTransfer();
    valid.forEach(f => dt.items.add(f));
    input.files = dt.files;

    const validText = valid.map(f => f.name).join(', ');
    const errorText = errors.length ? ' | Отклонено: ' + errors.join('; ') : '';
    div.textContent = validText + errorText;
}
</script>
{% endblock %}
