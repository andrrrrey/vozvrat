{% for file in refund.files %}
<div class="bg-gray-50 rounded-2xl p-3 flex items-center gap-3 group">
    <div class="w-10 h-10 rounded-xl {{ file.icon_classes }} flex items-center justify-center shrink-0">
        <span class="text-[10px] font-bold mono">{{ file.type_label }}</span>
    </div>
    <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-gray-800 truncate">{{ file.filename }}</p>
        <p class="text-[10px] text-gray-400">{{ file.size_human }}</p>
    </div>
    <a href="/api/files/{{ file.id }}/download"
        class="opacity-0 group-hover:opacity-100 transition-opacity p-1.5 bg-white rounded-lg shadow-sm text-gray-500 hover:text-gray-900"
        title="Скачать">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    </a>
</div>
{% else %}
<p class="text-xs text-gray-400 text-center py-4">Файлы не прикреплены</p>
{% endfor %}
