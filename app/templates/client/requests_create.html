{% extends "base.html" %}
{% block title %}Создать запрос{% endblock %}

{% block content %}
<div class="p-6 md:p-8 animate-screen">
    <div class="flex items-center gap-4 mb-6">
        <a href="/client/requests" class="w-9 h-9 flex items-center justify-center bg-white rounded-full border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors">
            <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div>
            <h1 class="text-xl font-bold text-gray-900">Новый запрос</h1>
            <p class="text-xs text-gray-500 mt-0.5">Обязательна только тема — остальное по желанию</p>
        </div>
    </div>

    <div class="max-w-3xl mx-auto">
        <form action="/api/requests/client" method="post" enctype="multipart/form-data" id="create-form">
            <!-- Order info -->
            <div class="bg-white rounded-[32px] shadow-sm border border-gray-100 p-8 mb-4">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-5">Информация</p>
                <div class="space-y-5">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Тема *</label>
                        <select name="subject" required class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm">
                            <option value="">— Выберите тему —</option>
                            {% for value, label in subjects %}
                            <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1.5">Опишите запрос</label>
                        <textarea name="reason" rows="3" placeholder="Опишите ваш вопрос или обращение..."
                            class="w-full bg-gray-50 rounded-2xl px-4 py-3 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm resize-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- Item (optional) -->
            <div class="bg-white rounded-[32px] shadow-sm border border-gray-100 p-8 mb-4">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-5">Позиция товара (необязательно)</p>
                <div class="item-row bg-gray-50 rounded-2xl p-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Артикул</label>
                            <input type="text" name="article[]" placeholder="BOSCH-199-22"
                                class="w-full bg-white rounded-xl px-3 py-2.5 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm mono">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Марка</label>
                            <input type="text" name="brand[]" placeholder="Bosch"
                                class="w-full bg-white rounded-xl px-3 py-2.5 ring-1 ring-gray-200 focus:ring-2 focus:ring-black focus:outline-none text-sm">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Files -->
            <div class="bg-white rounded-[32px] shadow-sm border border-gray-100 p-8 mb-6">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-5">Документы и фотографии</p>
                <label class="flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-[28px] p-8 text-center cursor-pointer hover:border-gray-300 hover:bg-gray-50 transition-all">
                    <svg class="w-10 h-10 text-gray-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    <p class="text-sm text-gray-400 font-medium">Перетащите файлы или нажмите для выбора</p>
                    <p class="text-xs text-gray-300 mt-1">XLS, XLSX, PDF, JPG, PNG, WEBP (до 20 МБ)</p>
                    <input type="file" name="file" multiple class="hidden" accept=".xls,.xlsx,.pdf,.jpg,.jpeg,.png,.webp" onchange="addFiles(this)">
                </label>
                <div id="file-preview" class="grid grid-cols-3 sm:grid-cols-4 gap-3 mt-4"></div>
                <div id="file-errors" class="mt-2 text-xs font-medium space-y-0.5"></div>
            </div>

            <div class="flex gap-3">
                <button type="submit"
                    class="flex-1 py-3.5 bg-gray-900 text-white rounded-2xl font-bold shadow-lg hover:bg-black transition-all text-sm">
                    Отправить запрос
                </button>
                <a href="/client/requests"
                    class="flex-none px-6 py-3.5 bg-gray-100 text-gray-600 rounded-2xl font-semibold hover:bg-gray-200 transition-all text-sm">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<script>
const ALLOWED_EXTS = new Set(['.xls', '.xlsx', '.pdf', '.jpg', '.jpeg', '.png', '.webp']);
const IMAGE_EXTS = new Set(['.jpg', '.jpeg', '.png', '.webp']);
const MAX_SIZE = 20 * 1024 * 1024;

let selectedFiles = [];

function extOf(name) { return name.slice(name.lastIndexOf('.')).toLowerCase(); }

function syncInput() {
    const dt = new DataTransfer();
    selectedFiles.forEach(f => dt.items.add(f));
    document.querySelector('input[name="file"]').files = dt.files;
}

function addFiles(input) {
    const errors = [];
    Array.from(input.files).forEach(f => {
        const ext = extOf(f.name);
        if (!ALLOWED_EXTS.has(ext)) {
            errors.push(`<p class="text-red-500">${f.name} — недопустимый формат</p>`);
        } else if (f.size > MAX_SIZE) {
            errors.push(`<p class="text-red-500">${f.name} — превышает 20 МБ</p>`);
        } else if (!selectedFiles.some(s => s.name === f.name && s.size === f.size)) {
            selectedFiles.push(f);
        }
    });
    document.getElementById('file-errors').innerHTML = errors.join('');
    syncInput();
    renderPreview();
}

function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    syncInput();
    renderPreview();
}

function renderPreview() {
    const grid = document.getElementById('file-preview');
    grid.innerHTML = '';
    selectedFiles.forEach((f, idx) => {
        const cell = document.createElement('div');
        cell.className = 'relative group rounded-2xl overflow-hidden ring-1 ring-gray-200 bg-gray-50 aspect-square flex items-center justify-center';
        if (IMAGE_EXTS.has(extOf(f.name))) {
            const img = document.createElement('img');
            img.className = 'w-full h-full object-cover';
            img.src = URL.createObjectURL(f);
            img.onload = () => URL.revokeObjectURL(img.src);
            cell.appendChild(img);
        } else {
            cell.innerHTML = `<div class="flex flex-col items-center px-2 text-center">
                <svg class="w-7 h-7 text-gray-300 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                <span class="text-[10px] text-gray-500 break-all leading-tight">${f.name}</span>
            </div>`;
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.title = 'Удалить';
        btn.className = 'absolute top-1 right-1 w-6 h-6 flex items-center justify-center bg-black/60 text-white rounded-full hover:bg-black transition-colors';
        btn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
        btn.onclick = () => removeFile(idx);
        cell.appendChild(btn);
        grid.appendChild(cell);
    });
}
</script>
{% endblock %}
