<div id="status-section" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Управление статусом</p>
    <div class="flex items-center gap-2 mb-4">
        <span class="text-sm text-gray-600">Текущий:</span>
        <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide {{ req.status_color }}">
            {{ req.status_label }}
        </span>
    </div>
    {% if user.role.value in ('admin', 'staff') %}
    <div class="flex flex-wrap gap-2">
        {% if req.status.value != 'received' %}
        <button
            hx-post="/api/requests/{{ req.id }}/status"
            hx-vals='{"status": "received"}'
            hx-target="#status-section"
            hx-swap="outerHTML"
            class="px-4 py-2 bg-blue-100 text-blue-700 rounded-xl text-xs font-bold hover:bg-blue-200 transition-colors">
            Получен
        </button>
        {% endif %}
        {% if req.status.value != 'in_work' %}
        <button
            hx-post="/api/requests/{{ req.id }}/status"
            hx-vals='{"status": "in_work"}'
            hx-target="#status-section"
            hx-swap="outerHTML"
            class="px-4 py-2 bg-amber-100 text-amber-700 rounded-xl text-xs font-bold hover:bg-amber-200 transition-colors">
            В работе
        </button>
        {% endif %}
        {% if req.status.value != 'completed' %}
        <button
            hx-post="/api/requests/{{ req.id }}/status"
            hx-vals='{"status": "completed"}'
            hx-target="#status-section"
            hx-swap="outerHTML"
            class="px-4 py-2 bg-green-100 text-green-700 rounded-xl text-xs font-bold hover:bg-green-200 transition-colors">
            Завершён
        </button>
        {% endif %}
    </div>
    {% endif %}
</div>
